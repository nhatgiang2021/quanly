<!DOCTYPE html>
<html lang="vi" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quản lý tài sản cá nhân</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./app.js?v=20260531-1"></script>
    <script>
      // Lucide icons auto-render on DOM changes (debounced to prevent cascade loop)
      let _lucideTimer = null;
      const observer = new MutationObserver(() => {
        if (!window.lucide) return;
        clearTimeout(_lucideTimer);
        _lucideTimer = setTimeout(() => {
          window.lucide.createIcons();
        }, 0);
      });
      observer.observe(document.getElementById("app"), { childList: true, subtree: true });
    </script>
  </body>
</html>
